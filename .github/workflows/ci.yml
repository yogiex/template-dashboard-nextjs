name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: "${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      # CI memvalidasi kontrak deploy yang sama dengan deploy.yml: build harus
      # menghasilkan static export. Kalau tidak, PR/ push gagal di sini lebih
      # dulu — bukan baru ketahuan saat upload Pages artifact.
      - name: Verify static export output
        run: |
          for file in out/index.html out/dashboard.html out/login.html; do
            if [ ! -f "$file" ]; then
              echo "::error file=next.config.ts::Static export tidak lengkap ('$file' tidak ada). Pastikan 'output: \"export\"' aktif di next.config.ts; Server Action dan cookie session tidak didukung target deploy GitHub Pages."
              exit 1
            fi
          done
