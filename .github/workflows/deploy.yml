name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: "${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}"
          NEXT_PUBLIC_APP_URL: "${{ format('https://{0}.github.io{1}', github.repository_owner, github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name)) }}"
          NODE_ENV: production

      # Fail-fast sebelum upload artifact. Kalau `output: "export"` hilang dari
      # next.config.ts (mis. karena Server Action/auth server-side masuk lagi),
      # `npm run build` tetap sukses sebagai build server biasa tapi tidak
      # menghasilkan `out/`, dan upload-pages-artifact gagal dengan pesan yang
      # tidak menunjuk sebab. Auth server-side butuh host Node — sampai host itu
      # ada, app harus bisa di-export statis.
      - name: Verify static export output
        run: |
          for file in out/index.html out/dashboard.html out/login.html; do
            if [ ! -f "$file" ]; then
              echo "::error file=next.config.ts::Static export tidak lengkap ('$file' tidak ada). Pastikan 'output: \"export\"' aktif di next.config.ts; Server Action dan cookie session tidak didukung GitHub Pages."
              exit 1
            fi
          done
          echo "Static export lengkap: $(find out -name '*.html' | wc -l) file HTML"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: smoke (public pages + assets)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Determine Pages URL
        id: url
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            url="https://${{ github.repository_owner }}.github.io"
          else
            url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "pages_url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test root
        run: curl -fsSL "${{ steps.url.outputs.pages_url }}/" >/dev/null

      - name: Smoke test dashboard
        run: curl -fsSL "${{ steps.url.outputs.pages_url }}/dashboard" >/dev/null

      - name: Smoke test about
        run: curl -fsSL "${{ steps.url.outputs.pages_url }}/about" >/dev/null

      - name: Smoke test favicon
        run: curl -fsSL "${{ steps.url.outputs.pages_url }}/favicon.ico" >/dev/null
